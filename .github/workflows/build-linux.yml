name: Build Electron App for Linux

on:
  push:
    branches: [main, master, feat-mpa]
    tags: ['v*']
  pull_request:
    branches: [main, master, feat-mpa]
  workflow_dispatch:

env:
  ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

jobs:
  build-linux-arm64:
    name: Build Linux ARM64
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package Electron App (ARM64)
        run: |
          npm run make -- --arch arm64 --platform linux

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: linux-arm64
          path: out/make/**/*
          if-no-files-found: error

  build-windows-x86:
    name: Build Windows x86
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package Electron App (x86)
        run: npm run make -- --arch ia32 --platform win32

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: windows-x86
          path: out/make/**/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [build-linux-arm64, build-windows-x86]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download Linux ARM64 artifacts
        uses: actions/download-artifact@v7
        with:
          name: linux-arm64
          path: release/linux-arm64

      - name: Download Windows x86 artifacts
        uses: actions/download-artifact@v7
        with:
          name: windows-x86
          path: release/windows-x86

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
