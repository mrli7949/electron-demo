server {
    listen 127.0.0.1:18088;
    server_name localhost;

    root /opt/zd-test-client/www;
    index index.html;

    access_log /var/log/nginx/zd-test-client.access.log;
    error_log /var/log/nginx/zd-test-client.error.log warn;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /config/ {
        try_files $uri =404;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

